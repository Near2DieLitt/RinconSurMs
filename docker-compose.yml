      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/rinconsur_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - NOTIFICACIONES_URL=http://gestion-notificaciones:8083
    depends_on:
      - eureka-server
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gestion-notificaciones:
