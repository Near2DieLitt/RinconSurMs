services:
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    restart: on-failure

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8800:8800"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: on-failure

  gestion-roles:
    build:
      context: ./gestion_roles
      dockerfile: Dockerfile
    container_name: gestion-roles
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/rinconsur_roles?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gestion-usuarios:
    build:
      context: ./gestion_usuarios
      dockerfile: Dockerfile
    container_name: gestion-usuarios
    ports:
      - "8082:8082"
